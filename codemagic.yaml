workflows:
  ios-unsigned-ipa:
    name: iOS Unsigned IPA Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Resolve project directory and get dependencies
        script: |
          TARGET_DIR="."
          if [ -d "face_attendance" ] && [ -f "face_attendance/pubspec.yaml" ]; then
            TARGET_DIR="face_attendance"
          fi
          cd $TARGET_DIR
          flutter pub get

      - name: Build iOS without code signing
        script: |
          TARGET_DIR="."
          if [ -d "face_attendance" ] && [ -f "face_attendance/pubspec.yaml" ]; then
            TARGET_DIR="face_attendance"
          fi
          cd $TARGET_DIR
          flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        script: |
          TARGET_DIR="."
          if [ -d "face_attendance" ] && [ -f "face_attendance/pubspec.yaml" ]; then
            TARGET_DIR="face_attendance"
          fi
          cd $TARGET_DIR
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y face_attendance_unsigned.ipa Payload
          # 아티팩트 검색을 위해 루트에도 복사
          if [ "$TARGET_DIR" != "." ]; then
            cp face_attendance_unsigned.ipa ../
          fi
    artifacts:
      - "*.ipa"
      - "**/*.ipa"
